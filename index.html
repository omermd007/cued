<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cued — Stop Scrolling, Start Watching</title>
  <meta name="description" content="Personal movie & series decider built to eliminate streaming decision fatigue." />

  <!-- iOS / Mobile PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cued" />
  <meta name="theme-color" content="#0E0D0C" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <polygon points="8,5 19,12 8,19" fill="#E05A3A" />
            <rect x="3" y="4" width="2" height="16" rx="1" fill="#F5F0E8" opacity="0.85" />
          </svg>
        </div>
        <h1 class="brand-name">Cued</h1>
      </div>
      <div class="topbar-right">
        <button class="dna-pill" id="dna-pill-btn" type="button" aria-label="View Taste DNA">
          <span class="meter-dot"></span>
          <span id="dna-pill-text">Starter</span>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Views -->
    <main class="main-content">
      <section id="view-tonight" class="view active" aria-label="Tonight Decider"></section>
      <section id="view-taste" class="view" aria-label="Taste DNA"></section>
      <section id="view-library" class="view" aria-label="Library"></section>
    </main>

    <!-- Bottom Tab Bar -->
    <nav class="tabbar" aria-label="Primary Navigation">
      <button class="tab-btn active" data-tab="tonight" type="button" aria-current="page">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4" />
        </svg>
        <span>Tonight</span>
      </button>
      <button class="tab-btn" data-tab="taste" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14" />
          <line x1="4" y1="10" x2="4" y2="3" />
          <line x1="12" y1="21" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12" y2="3" />
          <line x1="20" y1="21" x2="20" y2="16" />
          <line x1="20" y1="12" x2="20" y2="3" />
          <circle cx="4" cy="12" r="2" />
          <circle cx="12" cy="10" r="2" />
          <circle cx="20" cy="14" r="2" />
        </svg>
        <span>Taste DNA</span>
      </button>
      <button class="tab-btn" data-tab="library" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
        <span>Library</span>
      </button>
    </nav>
  </div>

  <!-- Bottom Sheet Modal -->
  <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true">
    <div class="sheet" id="sheet-content" role="dialog" aria-modal="true" aria-label="Modal dialog"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./data.js"></script>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
